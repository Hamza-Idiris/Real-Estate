name: ci
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test          # unit + security inventory + HTTP smoke (no database)
      - run: npm audit --omit=dev --audit-level=high
  server-integration:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: supercharge/mongodb-github-action@1.11.0
        with: { mongodb-version: '7.0', mongodb-replica-set: rs0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npm test
        env: { MONGO_TEST_URI: 'mongodb://127.0.0.1:27017/estateflow_test?replicaSet=rs0', MONGO_TEST_TX: 'true' }
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build     # type-check + bundle budget
      - run: npm audit --omit=dev --audit-level=high
